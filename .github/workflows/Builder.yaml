name: 一键编译 Zygisk 模块 (纯 C++ 直捣黄龙版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: 1. 准备 NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: 2. 下载 ShadowHook 预编译包 (免去源码编译烦恼)
      run: |
        mkdir -p third_party/shadowhook
        # 下载字节官方发布在 Maven 的预编译 AAR
        wget -q https://repo1.maven.org/maven2/com/bytedance/android/shadowhook/2.0.1/shadowhook-2.0.1.aar -O shadowhook.aar
        unzip -q shadowhook.aar -d third_party/shadowhook

    - name: 3. 生成 CMakeLists.txt
      run: |
        cat << 'EOF' > CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project("finger_spoof_zygisk")
        set(CMAKE_CXX_STANDARD 17)
        
        include_directories(
            ${CMAKE_SOURCE_DIR}/third_party/zygisk
            ${CMAKE_SOURCE_DIR}/third_party/shadowhook/prefab/modules/shadowhook/include
        )

        # 链接 ShadowHook 预编译静态库
        add_library(shadowhook STATIC IMPORTED)
        set_target_properties(shadowhook PROPERTIES IMPORTED_LOCATION
            ${CMAKE_SOURCE_DIR}/third_party/shadowhook/prefab/modules/shadowhook/libs/android.arm64-v8a/libshadowhook.a
        )

        add_library(finger_spoof_zygisk SHARED zygisk.cpp)
        target_link_libraries(finger_spoof_zygisk log android shadowhook c++_shared)
        target_compile_options(finger_spoof_zygisk PRIVATE -Os -fvisibility=hidden -fno-exceptions -fno-rtti)
        target_link_options(finger_spoof_zygisk PRIVATE -Wl,--allow-shlib-undefined)
        EOF

    - name: 4. 生成 zygisk.hpp
      run: |
        mkdir -p third_party/zygisk
        cat << 'EOF' > third_party/zygisk/zygisk.hpp
        #pragma once
        #include <jni.h>
        #include <sys/types.h>

        namespace zygisk {
        struct Api; struct AppSpecializeArgs;
        class ModuleBase {
        public:
            virtual void onLoad(Api *api, JNIEnv *env) {}
            virtual void postAppSpecialize(const AppSpecializeArgs *args) {}
        };
        struct AppSpecializeArgs { jint *uid; };
        struct Api {
            void setOption(int opt);
            enum Option { DLCLOSE_MODULE_LIBRARY = 0 };
        };
        #define REGISTER_ZYGISK_MODULE(cls) \
            extern "C" __attribute__((visibility("default"))) void zygisk_module_entry(zygisk::Api *api, JNIEnv *env) { \
                static cls module; module.onLoad(api, env); \
                api->setOption(zygisk::Api::Option::DLCLOSE_MODULE_LIBRARY); \
            }
        }
        EOF

    - name: 5. 生成核心 zygisk.cpp (纯 C++ 桥接 Hook)
      run: |
        cat << 'EOF' > zygisk.cpp
        #include <jni.h>
        #include <android/log.h>
        #include <unistd.h>
        #include <fcntl.h>
        #include <string.h>
        #include <sys/ioctl.h>
        #include <sys/socket.h>
        #include <netinet/in.h>
        #include <mutex>
        #include <string>
        #include "zygisk.hpp"
        #include "shadowhook.h"

        #define TAG "fp-zygisk"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)

        using zygisk::Api;
        using zygisk::AppSpecializeArgs;

        #define FP_MAGIC 0x70
        #define FP_CMD_GET_RULE 0xC0707006L 

        struct fp_field_value { char fake[256]; unsigned int len; };
        struct fp_rule { unsigned int uid; char package[128]; struct fp_field_value fields[18]; };

        static fp_rule g_currentRule;
        static bool g_hasRule = false;

        static void fetch_rule_from_kernel(uid_t uid) {
            int fd = socket(AF_INET, SOCK_DGRAM, 0);
            if (fd < 0) return;
            struct fp_rule req; memset(&req, 0, sizeof(req)); req.uid = uid;
            if (ioctl(fd, FP_CMD_GET_RULE, &req) == 0) {
                g_currentRule = req; g_hasRule = true;
            }
            close(fd);
        }

        static std::string get_fake(int field) {
            if (!g_hasRule || field < 0 || field >= 18) return "";
            const auto &fv = g_currentRule.fields[field];
            if (fv.len == 0) return "";
            return std::string(fv.fake, fv.len);
        }

        // ========================================================
        // 【核心替换】：纯 C++ 桥接函数，直接接管 Java 方法执行！
        // ========================================================
        
        // 1. 定义原始函数指针
        static jstring (*orig_getString)(JNIEnv*, jclass, jobject, jstring) = nullptr;
        static jstring (*orig_getImei)(JNIEnv*, jobject) = nullptr;

        // 2. 伪装 `Settings.Secure.getString`
        static jstring fake_getString(JNIEnv* env, jclass clazz, jobject resolver, jstring name) {
            if (name) {
                const char* c_name = env->GetStringUTFChars(name, nullptr);
                if (c_name && strcmp(c_name, "android_id") == 0) {
                    env->ReleaseStringUTFChars(name, c_name);
                    std::string fake_id = get_fake(1);
                    return env->NewStringUTF(fake_id.c_str());
                }
                env->ReleaseStringUTFChars(name, c_name);
            }
            // 不是 android_id，调用原方法
            return orig_getString ? orig_getString(env, clazz, resolver, name) : nullptr;
        }

        // 3. 伪装 `TelephonyManager.getImei`
        static jstring fake_getImei(JNIEnv* env, jobject thiz) {
            std::string fake_imei = get_fake(2);
            return env->NewStringUTF(fake_imei.c_str());
        }

        // 获取 ArtMethod 的 entry_point 偏移量 (Android 15 ARM64 下通常是 32)
        void* get_entry_point(void* art_method) {
            return *(void**)((uintptr_t)art_method + 32);
        }

        static void hook_java_methods(JNIEnv *env) {
            // Hook Android ID
            jclass secureClass = env->FindClass("android/provider/Settings$Secure");
            if (secureClass) {
                jmethodID mid = env->GetStaticMethodID(secureClass, "getString", "(Landroid/content/ContentResolver;Ljava/lang/String;)Ljava/lang/String;");
                if (mid) {
                    void* entry = get_entry_point((void*)mid);
                    shadowhook_hook_func_addr(entry, (void*)fake_getString, (void**)&orig_getString);
                    LOGI("Hooked Settings.Secure.getString!");
                }
                env->DeleteLocalRef(secureClass);
            }

            // Hook IMEI
            jclass tmClass = env->FindClass("android/telephony/TelephonyManager");
            if (tmClass) {
                jmethodID mid = env->GetMethodID(tmClass, "getImei", "()Ljava/lang/String;");
                if (mid) {
                    void* entry = get_entry_point((void*)mid);
                    shadowhook_hook_func_addr(entry, (void*)fake_getImei, (void**)&orig_getImei);
                    LOGI("Hooked TelephonyManager.getImei!");
                }
                env->DeleteLocalRef(tmClass);
            }
        }

        class FingerprintSpoofModule : public zygisk::ModuleBase {
        public:
            void onLoad(Api *api, JNIEnv *env) override { this->api = api; this->env = env; }
            void postAppSpecialize(const AppSpecializeArgs *args) override {
                uid_t uid = getuid();
                fetch_rule_from_kernel(uid);
                if (!g_hasRule) return;

                shadowhook_init(SHADOWHOOK_MODE_SHARED, false);

                // 执行纯 C++ 桥接 Hook
                hook_java_methods(env);

                // 极限隐蔽：Hook 结束后，直接从内存彻底卸载 Zygisk 模块！
                if (api) api->setOption(zygisk::Api::Option::DLCLOSE_MODULE_LIBRARY);
            }
        private:
            Api *api = nullptr; JNIEnv *env = nullptr;
        };

        REGISTER_ZYGISK_MODULE(FingerprintSpoofModule)
        JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM *vm, void *) { return JNI_VERSION_1_6; }
        EOF

    - name: 6. 编译
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30
        make

    - name: 7. 打包 (附带 c++ 运行库)
      run: |
        mkdir -p module/zygisk/arm64-v8a
        cp build/libfinger_spoof_zygisk.so module/zygisk/arm64-v8a/liboplus_sensor.so
        
        CXX_SHARED=$(find $ANDROID_NDK_HOME -name "libc++_shared.so" | grep arm64-v8a | head -n 1)
        cp "$CXX_SHARED" module/zygisk/arm64-v8a/
        
        printf "id=fp_sensor\nname=OPLUS Sensor Helper\nversion=v1.0\nversionCode=1\nauthor=Anonymous\ndescription=Hardware abstraction layer for oplus.\n" > module/module.prop
        cd module && zip -r ../FP_Zygisk_Module.zip *

    - name: 8. 上传
      uses: actions/upload-artifact@v4
      with:
        name: FP_Zygisk_Module
        path: FP_Zygisk_Module.zip
