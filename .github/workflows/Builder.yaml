name: 一键编译 Zygisk 模块 (ShadowHook 智能识别版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: 1. 检出并解压
      uses: actions/checkout@v4
      
    - name: 2. 解压并校正目录结构
      run: |
        unzip -q third_party.zip
        if [ ! -d "third_party" ]; then
            mkdir -p third_party
            mv lsplant dobby xdl zygisk third_party/ 2>/dev/null || true
        fi

    - name: 3. 下载 ShadowHook 源码 (智能识别目录名)
      run: |
        mkdir -p third_party
        # 下载最新的 shadowhook 源码
        wget -q https://github.com/bytedance/shadowhook/archive/refs/heads/master.zip -O shadowhook.zip
        unzip -q shadowhook.zip
        
        # 智能匹配解压出来的文件夹名字（可能是 shadowhook-master 或 android-inline-hook-master）
        EXTRACTED_DIR=$(ls -d */ | grep -E "shadowhook|inline-hook" | head -n 1)
        if [ -n "$EXTRACTED_DIR" ]; then
            mv "$EXTRACTED_DIR" third_party/shadowhook
            echo "成功将 $EXTRACTED_DIR 重命名为 third_party/shadowhook"
        else
            echo "❌ 找不到解压出来的 ShadowHook 目录！"
            ls -la
            exit 1
        fi

    - name: 4. 准备 NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: 5. 修补 LSPlant 的 xz 依赖
      run: |
        find third_party/lsplant -name "*.cc" -exec sed -i 's|#include <linux/xz.h>|#include "xz.h"|g' {} +
        find third_party/lsplant -name "*.cc" -exec sed -i 's|#include <xz.h>|#include "xz.h"|g' {} +
        
        UTILS_DIR=$(find third_party/lsplant -type d -name "utils" | head -n 1)
        if [ -n "$UTILS_DIR" ]; then
            cat << 'EOF' > $UTILS_DIR/xz.h
        #pragma once
        #include <stddef.h>
        #include <stdint.h>
        #ifdef __cplusplus
        extern "C" {
        #endif
        enum xz_mode { XZ_SINGLE, XZ_PREALLOC, XZ_DYNALLOC };
        enum xz_ret { XZ_OK, XZ_STREAM_END, XZ_MEMLIMIT_ERROR, XZ_FORMAT_ERROR, XZ_OPTIONS_ERROR, XZ_DATA_ERROR, XZ_BUF_ERROR };
        struct xz_buf { const uint8_t *in; size_t in_pos; size_t in_size; uint8_t *out; size_t out_pos; size_t out_size; };
        struct xz_dec;
        struct xz_dec *xz_dec_init(enum xz_mode mode, uint32_t dict_max);
        enum xz_ret xz_dec_run(struct xz_dec *s, struct xz_buf *b);
        void xz_dec_end(struct xz_dec *s);
        void xz_crc32_init(void);
        #ifdef __cplusplus
        }
        #endif
        EOF
            cat << 'EOF' > $UTILS_DIR/xz_stub.c
        #include "xz.h"
        struct xz_dec *xz_dec_init(enum xz_mode mode, uint32_t dict_max) { return 0; }
        enum xz_ret xz_dec_run(struct xz_dec *s, struct xz_buf *b) { return XZ_DATA_ERROR; }
        void xz_dec_end(struct xz_dec *s) {}
        void xz_crc32_init(void) {}
        EOF
        fi

    - name: 6. 生成 CMakeLists.txt (集成 ShadowHook 静态库)
      run: |
        cat << 'EOF' > CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project("finger_spoof_zygisk")
        set(CMAKE_CXX_STANDARD 20)
        
        include_directories(
            ${CMAKE_SOURCE_DIR}/third_party/zygisk
            ${CMAKE_SOURCE_DIR}/third_party/xdl/include
            ${CMAKE_SOURCE_DIR}/third_party/xdl/src
            ${CMAKE_SOURCE_DIR}/third_party/lsplant/include
            ${CMAKE_SOURCE_DIR}/third_party/lsplant/lsplant/include
            ${CMAKE_SOURCE_DIR}/third_party/lsplant/src/main/cpp
            ${CMAKE_SOURCE_DIR}/third_party/shadowhook/shadowhook/src/main/cpp/include
        )
        
        # 配置 ShadowHook 为静态库
        set(SHADOWHOOK_STATIC ON CACHE BOOL "")
        add_subdirectory(third_party/shadowhook/shadowhook/src/main/cpp)

        # 1. xdl
        file(GLOB_RECURSE XDL_SOURCES "${CMAKE_SOURCE_DIR}/third_party/xdl/*.c")
        add_library(xdl STATIC ${XDL_SOURCES})
        target_link_libraries(xdl log)

        # 2. LSPlant
        file(GLOB_RECURSE LSPLANT_SOURCES "${CMAKE_SOURCE_DIR}/third_party/lsplant/*.cc")
        set(LSPLANT_STUB_C "")
        if(EXISTS "${CMAKE_SOURCE_DIR}/third_party/lsplant/lsplant/src/main/cpp/utils/xz_stub.c")
            set(LSPLANT_STUB_C "${CMAKE_SOURCE_DIR}/third_party/lsplant/lsplant/src/main/cpp/utils/xz_stub.c")
        elseif(EXISTS "${CMAKE_SOURCE_DIR}/third_party/lsplant/src/main/cpp/utils/xz_stub.c")
            set(LSPLANT_STUB_C "${CMAKE_SOURCE_DIR}/third_party/lsplant/src/main/cpp/utils/xz_stub.c")
        endif()
        add_library(lsplant STATIC ${LSPLANT_SOURCES} ${LSPLANT_STUB_C})
        target_link_libraries(lsplant xdl)

        # 3. Zygisk 模块 (链接 ShadowHook)
        add_library(finger_spoof_zygisk SHARED zygisk.cpp)
        target_link_libraries(finger_spoof_zygisk log android lsplant xdl shadowhook)
        target_compile_options(finger_spoof_zygisk PRIVATE -Os -fvisibility=hidden -fno-exceptions -fno-rtti)
        EOF

    - name: 7. 生成 zygisk.cpp 和 zygisk.hpp (使用 ShadowHook)
      run: |
        cat << 'EOF' > zygisk.hpp
        #pragma once
        #include <jni.h>
        #include <sys/types.h>
        #include <cstdint>
        #include <string_view>

        namespace zygisk {
        struct Api;
        struct AppSpecializeArgs;
        struct ServerSpecializeArgs;

        class ModuleBase {
        public:
            virtual void onLoad(Api *api, JNIEnv *env) {}
            virtual void preAppSpecialize(AppSpecializeArgs *args) {}
            virtual void postAppSpecialize(const AppSpecializeArgs *args) {}
            virtual void preServerSpecialize(ServerSpecializeArgs *args) {}
            virtual void postServerSpecialize(const ServerSpecializeArgs *args) {}
        };

        struct AppSpecializeArgs {
            jstring nice_name; jstring app_data_dir; const char *const *args;
            jint *uid; jint *gid; jintArray *gids; jint *runtime_flags;
            jobjectArray *rlimits; jstring *instruction_set;
            const char *const *app_path; jstring *app_lib_dir;
            const char *const *permitted_paths; jint *mount_external; jstring *se_info;
        };

        struct ServerSpecializeArgs { jint *uid; jint *gid; jintArray *gids; jint *runtime_flags; };

        struct Api {
            void connectCompanion(int pid); void connectCompanion();
            int getModuleDir(); void setOption(int opt);
            enum Option { DLCLOSE_MODULE_LIBRARY = 0 };
        };

        #define REGISTER_ZYGISK_MODULE(cls) \
            extern "C" __attribute__((visibility("default"))) void zygisk_module_entry(zygisk::Api *api, JNIEnv *env) { \
                static cls module; module.onLoad(api, env); \
                api->setOption(zygisk::Api::Option::DLCLOSE_MODULE_LIBRARY); \
            }
        }
        EOF

        cat << 'EOF' > zygisk.cpp
        #include <jni.h>
        #include <android/log.h>
        #include <unistd.h>
        #include <fcntl.h>
        #include <string.h>
        #include <sys/ioctl.h>
        #include <sys/socket.h>
        #include <netinet/in.h>
        #include <mutex>
        #include <string>
        #include <sys/mman.h>

        #include "zygisk.hpp"
        #include "lsplant.hpp"
        #include "xdl.h"
        #include "shadowhook.h"

        #define TAG "fp-zygisk"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)

        using zygisk::Api;
        using zygisk::AppSpecializeArgs;

        #define FP_FIELD_MAX      18
        #define FP_NAME_MAX       128
        #define FP_VALUE_MAX      256
        #define FP_FIELD_COUNT    (FP_FIELD_MAX)
        #define FP_MAGIC          0x70
        #define FP_CMD_GET_RULE   0xC0707006L 

        struct fp_field_value { char fake[FP_VALUE_MAX]; unsigned int len; };
        struct fp_rule { unsigned int uid; char package[FP_NAME_MAX]; struct fp_field_value fields[FP_FIELD_COUNT]; };

        static std::mutex g_lock;
        static fp_rule g_currentRule;
        static bool g_hasRule = false;

        // 使用 ShadowHook 进行内联 Hook
        void* inline_hooker(void* target, void* hooker) {
            return shadowhook_hook_func_addr(target, hooker, nullptr);
        }

        bool inline_unhooker(void* stub) {
            return shadowhook_unhook(stub) == 0;
        }

        void* art_symbol_resolver(std::string_view symbol_name) {
            void* handle = xdl_open("libart.so", XDL_DEFAULT);
            if (!handle) return nullptr;
            void* sym = xdl_sym(handle, symbol_name.data(), nullptr);
            xdl_close(handle);
            return sym;
        }

        static void fetch_rule_from_kernel(uid_t uid) {
            int fd = socket(AF_INET, SOCK_DGRAM, 0);
            if (fd < 0) return;
            struct fp_rule req; memset(&req, 0, sizeof(req)); req.uid = uid;
            if (ioctl(fd, FP_CMD_GET_RULE, &req) == 0) {
                std::lock_guard<std::mutex> lk(g_lock);
                g_currentRule = req; g_hasRule = true;
            }
            close(fd);
        }

        static std::string get_fake(int field) {
            std::lock_guard<std::mutex> lk(g_lock);
            if (!g_hasRule || field < 0 || field >= FP_FIELD_COUNT) return "";
            const auto &fv = g_currentRule.fields[field];
            if (fv.len == 0) return "";
            return std::string(fv.fake, fv.len);
        }

        static void hook_java_methods(JNIEnv *env) {
            std::string fake_id = get_fake(1); 
            if (!fake_id.empty()) {
                jclass secureClass = env->FindClass("android/provider/Settings$Secure");
                if (secureClass) {
                    jmethodID mid = env->GetStaticMethodID(secureClass, "getString", "(Landroid/content/ContentResolver;Ljava/lang/String;)Ljava/lang/String;");
                    if (mid) {
                        lsplant::Hook(env, mid, [fake_id](JNIEnv* e, jobject thiz, jobject resolver, jstring name) -> jobject {
                            if (name) {
                                const char* c_name = e->GetStringUTFChars(name, nullptr);
                                if (c_name && strcmp(c_name, "android_id") == 0) {
                                    e->ReleaseStringUTFChars(name, c_name);
                                    return e->NewStringUTF(fake_id.c_str());
                                }
                                e->ReleaseStringUTFChars(name, c_name);
                            }
                            return nullptr;
                        });
                    }
                    env->DeleteLocalRef(secureClass);
                }
            }
            
            std::string fake_imei = get_fake(2);
            if (!fake_imei.empty()) {
                jclass tmClass = env->FindClass("android/telephony/TelephonyManager");
                if (tmClass) {
                    jmethodID mid = env->GetMethodID(tmClass, "getImei", "()Ljava/lang/String;");
                    if (mid) {
                        lsplant::Hook(env, mid, [fake_imei](JNIEnv* e, jobject thiz) -> jobject {
                            return e->NewStringUTF(fake_imei.c_str());
                        });
                    }
                    env->DeleteLocalRef(tmClass);
                }
            }
        }

        class FingerprintSpoofModule : public zygisk::ModuleBase {
        public:
            void onLoad(Api *api, JNIEnv *env) override { this->api = api; this->env = env; }
            void postAppSpecialize(const AppSpecializeArgs *args) override {
                uid_t uid = getuid();
                fetch_rule_from_kernel(uid);
                if (!g_hasRule) return;

                // 初始化 ShadowHook
                shadowhook_init(shadowhook_mode_t::SHADOWHOOK_MODE_SHARED, false);

                lsplant::InitInfo info {
                    .inline_hooker = inline_hooker,
                    .inline_unhooker = inline_unhooker,
                    .art_symbol_resolver = art_symbol_resolver
                };
                lsplant::Init(env, info);
                
                hook_java_methods(env);

                if (api) api->setOption(zygisk::Api::Option::DLCLOSE_MODULE_LIBRARY);
            }
        private:
            Api *api = nullptr; JNIEnv *env = nullptr;
        };

        REGISTER_ZYGISK_MODULE(FingerprintSpoofModule)
        JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM *vm, void *) { return JNI_VERSION_1_6; }
        EOF

    - name: 8. 编译 Zygisk 模块
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-30 \
          -DCMAKE_BUILD_TYPE=Release
        make

    - name: 9. 打包成 Magisk / KernelSU 模块 Zip
      run: |
        mkdir -p module/zygisk/arm64-v8a
        cp build/libfinger_spoof_zygisk.so module/zygisk/arm64-v8a/liboplus_sensor.so
        
        cat << 'EOF' > module/module.prop
        id=fp_sensor
        name=OPLUS Sensor Helper
        version=v1.0
        versionCode=1
        author=Anonymous
        description=Hardware abstraction layer for oplus.
        EOF
        
        cd module
        zip -r ../FP_Zygisk_Module.zip *

    - name: 10. 上传模块压缩包 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: FP_Zygisk_Module
        path: FP_Zygisk_Module.zip
