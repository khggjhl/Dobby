name: 一键编译 Zygisk 模块 (Pine Hook终极通关版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: 1. 准备 Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c

    - name: 2. 下载依赖并自动打补丁修复官方代码 Bug
      run: |
        mkdir -p third_party
        git clone --depth 1 https://github.com/canyie/pine.git third_party/pine
        
        # 【修复1】重写 scoped_local_ref.h
        cat << 'EOF' > third_party/pine/core/src/main/cpp/utils/scoped_local_ref.h
        #pragma once
        #include <jni.h>
        #include <cstddef>
        #include <cstdint>
        namespace pine {
        template <typename T>
        class ScopedLocalRef {
         public:
          ScopedLocalRef(JNIEnv* env) : env_(env), ref_(nullptr) {}
          ScopedLocalRef(JNIEnv* env, T ref) : env_(env), ref_(ref) {}
          ~ScopedLocalRef() { if (ref_ != nullptr) env_->DeleteLocalRef(ref_); }
          T Get() const { return ref_; }
          T Release() { T ret = ref_; ref_ = nullptr; return ret; }
          void Reset(T ref = nullptr) { if (ref_ != nullptr) env_->DeleteLocalRef(ref_); ref_ = ref; }
          bool IsNull() const { return ref_ == nullptr; }
          JNIEnv* Env() const { return env_; }
         private:
          JNIEnv* env_;
          T ref_;
        };
        class ScopedLocalClassRef : public ScopedLocalRef<jclass> {
         public:
          ScopedLocalClassRef(JNIEnv* env) : ScopedLocalRef<jclass>(env) {}
          ScopedLocalClassRef(JNIEnv* env, jclass ref) : ScopedLocalRef<jclass>(env, ref) {}
          ScopedLocalClassRef(JNIEnv* env, const char* name) : ScopedLocalRef<jclass>(env, env->FindClass(name)) {}
          jmethodID GetMethodID(const char* name, const char* signature) { return Env()->GetMethodID(Get(), name, signature); }
          jmethodID GetStaticMethodID(const char* name, const char* signature) { return Env()->GetStaticMethodID(Get(), name, signature); }
          jmethodID FindMethodID(const char* name, const char* signature) { return Env()->GetMethodID(Get(), name, signature); }
        };
        class ScopedLocalUtfStringRef : public ScopedLocalRef<jstring> {
         public:
          ScopedLocalUtfStringRef(JNIEnv* env) : ScopedLocalRef<jstring>(env) {}
          ScopedLocalUtfStringRef(JNIEnv* env, jstring ref) : ScopedLocalRef<jstring>(env, ref) {}
          ScopedLocalUtfStringRef(JNIEnv* env, const char* content) : ScopedLocalRef<jstring>(env, env->NewStringUTF(content)) {}
        };
        }
        EOF

        sed -i 's/ ScopedLocalClassRef / pine::ScopedLocalClassRef /g' third_party/pine/core/src/main/cpp/jni_bridge.cpp
        sed -i 's/(ScopedLocalClassRef/(pine::ScopedLocalClassRef/g' third_party/pine/core/src/main/cpp/jni_bridge.cpp

        # 【修复2】解决 xz.h 缺失
        sed -i 's|#include <linux/xz.h>|#include "xz.h"|' third_party/pine/core/src/main/cpp/utils/elf_image.cpp
        sed -i 's|#include <xz.h>|#include "xz.h"|' third_party/pine/core/src/main/cpp/utils/elf_image.cpp
        
        cat << 'EOF' > third_party/pine/core/src/main/cpp/utils/xz.h
        #pragma once
        #include <stddef.h>
        #include <stdint.h>
        #ifdef __cplusplus
        extern "C" {
        #endif
        enum xz_mode { XZ_SINGLE, XZ_PREALLOC, XZ_DYNALLOC };
        enum xz_ret { XZ_OK, XZ_STREAM_END, XZ_MEMLIMIT_ERROR, XZ_FORMAT_ERROR, XZ_OPTIONS_ERROR, XZ_DATA_ERROR, XZ_BUF_ERROR };
        struct xz_buf { const uint8_t *in; size_t in_pos; size_t in_size; uint8_t *out; size_t out_pos; size_t out_size; };
        struct xz_dec;
        struct xz_dec *xz_dec_init(enum xz_mode mode, uint32_t dict_max);
        enum xz_ret xz_dec_run(struct xz_dec *s, struct xz_buf *b);
        void xz_dec_end(struct xz_dec *s);
        void xz_crc32_init(void);
        #ifdef __cplusplus
        }
        #endif
        EOF

        cat << 'EOF' > third_party/pine/core/src/main/cpp/utils/xz_stub.c
        #include "xz.h"
        struct xz_dec *xz_dec_init(enum xz_mode mode, uint32_t dict_max) { return 0; }
        enum xz_ret xz_dec_run(struct xz_dec *s, struct xz_buf *b) { return XZ_DATA_ERROR; }
        void xz_dec_end(struct xz_dec *s) {}
        void xz_crc32_init(void) {}
        EOF

        # 【修复3】暴力搜索 pine.h 并放到能被找到的根目录
        find third_party/pine -name "pine.h" -exec cp {} third_party/pine/ \;
        cp third_party/pine/pine.h . || true

    - name: 3. 生成 zygisk.hpp
      run: |
        mkdir -p third_party/zygisk
        cat << 'EOF' > third_party/zygisk/zygisk.hpp
        #pragma once
        #include <jni.h>
        #include <sys/types.h>
        #include <cstdint>
        #include <string_view>

        namespace zygisk {
        struct Api;
        struct AppSpecializeArgs;
        struct ServerSpecializeArgs;

        class ModuleBase {
        public:
            virtual void onLoad(Api *api, JNIEnv *env) {}
            virtual void preAppSpecialize(AppSpecializeArgs *args) {}
            virtual void postAppSpecialize(const AppSpecializeArgs *args) {}
            virtual void preServerSpecialize(ServerSpecializeArgs *args) {}
            virtual void postServerSpecialize(const ServerSpecializeArgs *args) {}
        };

        struct AppSpecializeArgs {
            jstring nice_name; jstring app_data_dir; const char *const *args;
            jint *uid; jint *gid; jintArray *gids; jint *runtime_flags;
            jobjectArray *rlimits; jstring *instruction_set;
            const char *const *app_path; jstring *app_lib_dir;
            const char *const *permitted_paths; jint *mount_external; jstring *se_info;
        };

        struct ServerSpecializeArgs { jint *uid; jint *gid; jintArray *gids; jint *runtime_flags; };

        struct Api {
            void connectCompanion(int pid); void connectCompanion();
            int getModuleDir(); void setOption(int opt);
            enum Option { DLCLOSE_MODULE_LIBRARY = 0 };
        };

        #define REGISTER_ZYGISK_MODULE(cls) \
            extern "C" __attribute__((visibility("default"))) void zygisk_module_entry(zygisk::Api *api, JNIEnv *env) { \
                static cls module; module.onLoad(api, env); \
                api->setOption(zygisk::Api::Option::DLCLOSE_MODULE_LIBRARY); \
            }
        }
        EOF

    - name: 4. 生成主 CMakeLists.txt
      run: |
        cat << 'EOF' > CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project("finger_spoof_zygisk")
        set(CMAKE_CXX_STANDARD 17)
        
        # 【修复】把所有可能的目录全加进来，绝对不让它找不到
        include_directories(
            ${CMAKE_SOURCE_DIR}
            ${CMAKE_SOURCE_DIR}/third_party/zygisk
            ${CMAKE_SOURCE_DIR}/third_party/pine
            ${CMAKE_SOURCE_DIR}/third_party/pine/include
            ${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp
            ${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/art
            ${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/trampoline
            ${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/utils
        )
        
        file(GLOB_RECURSE PINE_SOURCES 
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/android.cpp"
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/jni_bridge.cpp"
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/pine.cpp"
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/art/*.cpp"
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/trampoline/*.cpp"
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/trampoline/*.S"
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/utils/*.cpp"
            "${CMAKE_SOURCE_DIR}/third_party/pine/core/src/main/cpp/utils/xz_stub.c"
        )

        list(FILTER PINE_SOURCES EXCLUDE REGEX ".*/thumb2.cpp")
        list(FILTER PINE_SOURCES EXCLUDE REGEX ".*/arm32.cpp")
        list(FILTER PINE_SOURCES EXCLUDE REGEX ".*/x86.cpp")
        list(FILTER PINE_SOURCES EXCLUDE REGEX ".*/x86_64.cpp")

        add_library(pine STATIC ${PINE_SOURCES})
        target_link_libraries(pine log)
        target_compile_options(pine PRIVATE -Wno-format -Wno-nontrivial-memaccess)

        add_library(finger_spoof_zygisk SHARED zygisk.cpp)
        target_link_libraries(finger_spoof_zygisk log android pine)
        target_compile_options(finger_spoof_zygisk PRIVATE -Os -fvisibility=hidden -fno-exceptions -fno-rtti)
EOF

    - 姓名: 5. 生成核心 zygisk.cpp
跑: |
        cat << 'EOF' > zygisk.cpp
        #include <jni.h>
        #include <android/log.h>
        #include <unistd.h>
        #include <fcntl.h>
        #include <string.h>
        #include <sys/ioctl.h>
        #include <sys/socket.h>
        #include <netinet/in.h>
        #include <mutex>
        #include <string>

        #include "zygisk.hpp"
        // 尝试只写文件名，让 CMake 自己去搜索
        #include "pine.h"

        #define TAG "fp-zygisk"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, TAG, __VA_ARGS__)

        using zygisk::Api;
        using zygisk::AppSpecializeArgs;

        #define FP_FIELD_MAX      18
        #define FP_NAME_MAX       128
        #define FP_VALUE_MAX      256
        #define FP_FIELD_COUNT    (FP_FIELD_MAX)
        #define FP_MAGIC          0x70
        #define FP_CMD_GET_RULE   0xC0707006L 

结构fp_field_value{char fake[FP_VALUE_MAX]；unsigned int len；}；
结构fp_rule{unsigned int uid；char包[FP_NAME_MAX]；结构fp_field_value字段[FP_FIELD_COUNT]；}；

静态std：：互斥体g_lock；
静态fp_rule g_currentRule；
静态bool g_hasRule=false；

静态空值fetch_rule_from_kernel(uid_tuid){
int fd=套接字(AF_INET，SOCK_Dgram，0)；
if(fd<0)返回；
结构fp_rule req；memset(&req，0，sizeof(req))；req.uid=uid；
if(ioctl(fd，FP_CMD_GET_RULE，&req)==0){
STD：：lock_guard<std：：mutex>lk(g_lock)；
G_currentRule=req；g_hasRule=true；
            }
关闭(fd)；
        }

静态std：：string get_fake(int字段){
STD：：lock_guard<std：：mutex>lk(g_lock)；
if(！G_hasRule||field<0||field>=FP_FIELD_COUNT)返回""；
常数auto&fv=g_currentRule.fields[field]；
if(fv.len==0)返回""；
            return std::string(fv.fake, fv.len);
        }

        static void hook_java_methods(JNIEnv *env) {
            std::string fake_id = get_fake(1); 
            if (!fake_id.empty()) {
                jclass secureClass = env->FindClass("android/provider/Settings$Secure");
                if (secureClass) {
                    jmethodID mid = env->GetStaticMethodID(secureClass, "getString", "(Landroid/content/ContentResolver;Ljava/lang/String;)Ljava/lang/String;");
                    if (mid) {
                        pine::Pine::hook(env, mid, [fake_id](pine::CallFrame* callFrame) {
                            JNIEnv* e = callFrame->env;
                            jstring name = static_cast<jstring>(callFrame->args[1]);
                            if (name) {
                                const char* c_name = e->GetStringUTFChars(name, nullptr);
                                if (c_name && strcmp(c_name, "android_id") == 0) {
                                    e->ReleaseStringUTFChars(name, c_name);
                                    callFrame->setResult(e->NewStringUTF(fake_id.c_str()));
                                    return;
                                }
                                e->ReleaseStringUTFChars(name, c_name);
                            }
                        });
                    }
                    env->DeleteLocalRef(secureClass);
                }
            }

            std::string fake_imei = get_fake(2);
            if (!fake_imei.empty()) {
                jclass tmClass = env->FindClass("android/telephony/TelephonyManager");
                if (tmClass) {
                    jmethodID mid = env->GetMethodID(tmClass, "getImei", "()Ljava/lang/String;");
                    if (mid) {
                        pine::Pine::hook(env, mid, [fake_imei](pine::CallFrame* callFrame) {
                            callFrame->setResult(callFrame->env->NewStringUTF(fake_imei.c_str()));
                        });
                    }
                    env->DeleteLocalRef(tmClass);
                }
            }
            
            std::string fake_serial = get_fake(0);
            if (!fake_serial.empty()) {
                jclass buildClass = env->FindClass("android/os/Build");
                if (buildClass) {
                    jmethodID mid = env->GetStaticMethodID(buildClass, "getSerial", "()Ljava/lang/String;");
                    if (mid) {
                        pine::Pine::hook(env, mid, [fake_serial](pine::CallFrame* callFrame) {
                            callFrame->setResult(callFrame->env->NewStringUTF(fake_serial.c_str()));
                        });
                    }
                    env->DeleteLocalRef(buildClass);
                }
            }
            
            std::string fake_mac = get_fake(4);
            if (!fake_mac.empty()) {
                jclass niClass = env->FindClass("java/net/NetworkInterface");
                if (niClass) {
                    jmethodID mid = env->GetMethodID(niClass, "getHardwareAddress", "()[B");
                    if (mid) {
                        unsigned char mac[6] = {0};
                        sscanf(fake_mac.c_str(), "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx", &mac[0], &mac[1], &mac[2], &mac[3], &mac[4], &mac[5]);
                        pine::Pine::hook(env, mid, [mac](pine::CallFrame* callFrame) {
                            JNIEnv* e = callFrame->env;
                            jbyteArray arr = e->NewByteArray(6);
e->SetByteArrayRegion(arr，0，6，reinterpret_cast<const jbyte*>(mac))；
callFrame->setResult(arr)；
                        });
                    }
env->DeleteLocalRef(niClass)；
                }
            }
        }

